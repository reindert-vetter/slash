<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instellingen — PR Review Tree</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
    <script>
      // Anti-flash: apply the persisted theme choice synchronously, before
      // Tailwind's CDN script even parses (let alone paints) — see
      // src/theme.mjs, which re-applies this reactively once the app module
      // loads and keeps 'system' live via a matchMedia listener. Duplicated
      // here (not imported) because ES modules load async and this must run
      // before the very first paint. Identical to index.html/overview.html.
      ;(function () {
        var pref = 'system'
        try {
          var v = localStorage.getItem('theme')
          if (v === 'light' || v === 'dark' || v === 'system') pref = v
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Manual dark/light toggle (src/theme.mjs, three-state: system/light/
      // dark) — 'selector' makes every dark: utility key off a `.dark` class
      // on <html> instead of prefers-color-scheme directly. See
      // .claude/rules/conventions.md ("Thema: systeem/licht/donker").
      tailwind.config = { darkMode: 'selector' }
    </script>
    <style>
      /* Native scrollbar colour follows the *used* color-scheme, not
         background colours or Tailwind's .dark class — unlike the Prism/
         markdown-body block this page deliberately omits (see the comment
         below), this one applies here too since every page has a native
         scrollbar. Same base + @media fallback + data-theme mirror shape as
         index.html/overview.html. */
      :root {
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      /* Keep programmatic scrolling (scrollIntoView for keyboard nav) but hide
         the scrollbar chrome — the panels read as clean floating blocks. */
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Deliberately NO Prism/.markdown-body CSS block here (unlike
         index.html/overview.html): this page shows no code or
         rendered Markdown, so there is nothing for those rules to style — see
         .claude/docs/settings-page.md. */
    </style>
  </head>
  <body class="h-screen overflow-hidden bg-white text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <div id="app"></div>
    <script type="module" src="/src/settings.mjs"></script>
  </body>
</html>
