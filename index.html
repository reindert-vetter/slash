<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR Review Tree</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
    <script>
      // Anti-flash: apply the persisted theme choice synchronously, before
      // Tailwind's CDN script even parses (let alone paints) — see
      // src/theme.mjs, which re-applies this reactively once the app module
      // loads and keeps 'system' live via a matchMedia listener. Duplicated
      // here (not imported) because ES modules load async and this must run
      // before the very first paint.
      ;(function () {
        var pref = 'system'
        try {
          var v = localStorage.getItem('theme')
          if (v === 'light' || v === 'dark' || v === 'system') pref = v
        } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Manual dark/light toggle (src/theme.mjs, three-state: system/light/
      // dark) — 'selector' makes every dark: utility key off a `.dark` class
      // on <html> instead of prefers-color-scheme directly. See
      // .claude/rules/conventions.md ("Thema: systeem/licht/donker").
      //
      // `narrow` is a custom, max-width screen (a hard cutoff at 1400px, not
      // a gradually-scaling vw-based value) used by Block.mjs's widthCls and
      // RelatedPanel.mjs's relatedColumnWidthCls to shrink the diff card and
      // the comments/Onderliggende-code column below that width — see
      // "Narrow viewport (< 1400px)" in detail-layout.md. At/above 1400px
      // nothing changes: the `narrow:` utilities Tailwind generates for it
      // simply never match. Tailwind always emits a screen's CSS after the
      // unprefixed base utility (same source-order mechanism min-width
      // screens like the existing `2xl:` already rely on), so a `narrow:`
      // class placed alongside a base class reliably overrides it once the
      // viewport drops under 1400px, with no specificity conflict.
      tailwind.config = { darkMode: 'selector', theme: { extend: { screens: { narrow: { max: '1399px' } } } } }
    </script>
    <style>
      /* Native scrollbar colour follows the *used* color-scheme, not
         background colours or Tailwind's .dark class — Chromium draws a
         light scrollbar in a dark UI unless this is set explicitly. Same
         three-way mechanism as the Prism/markdown-body blocks below (base +
         @media fallback with the light-override gate + data-theme mirror). */
      :root {
        color-scheme: light;
      }
      /* Keep programmatic scrolling (scrollIntoView for keyboard nav) but hide
         the scrollbar chrome — the panels read as clean floating blocks. */
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }


      /* Bottom fade for a truncated INLINE code fence inside a comment/Claude
         chat bubble (markdown.mjs's extractCodeFences, `truncate` on) — a
         purely visual "there's more, see the full preview below" cue instead
         of a "+N regels" text line, since the full code already has its own
         full-size preview card stacked below the comment/Claude column (see
         "A full-size code-preview column" in claude-chat-panel.md). Applied to
         the <pre> only when it actually shows a truncated fence
         (`code-fence-fade-bottom`, always paired with `data-fence-truncated`).
         Also reused, deliberately, by a collapsed "Aanpassingen sinds jouw
         review" block in the PR-info column (home.mjs's sinceReviewBlock,
         paired with `data-since-collapsed`) — the mask is generic, only the
         name recalls its first caller;
         the em unit is relative to that <pre>'s own font-size, so it fades
         roughly the height of its last visible line regardless of the
         surrounding bubble's text size. A plain alpha mask, not colour, so no
         dark-mode variant is needed. */
      .code-fence-fade-bottom {
        -webkit-mask-image: linear-gradient(to bottom, black, black calc(100% - 1.4em), transparent);
        mask-image: linear-gradient(to bottom, black, black calc(100% - 1.4em), transparent);
      }

      /* A small, subtle one-shot entrance animation for a newly-opened drilled
         Onderliggende-code column (see the drillOpenMarker comment in
         home.mjs) — a short fade + slight slide-in, never a repeating/looping
         animation, so it can't nag on its own. home.mjs only ever adds this
         class to a column's very first render right after a real "open"
         (drillIntoChild); a later rebuild of the same column (code arriving,
         a focus flip) never re-adds it, so this never replays on plain
         navigation. Respects prefers-reduced-motion. */
      @media (prefers-reduced-motion: no-preference) {
        @keyframes drillIn {
          from {
            opacity: 0;
            transform: translateX(6px);
          }
          to {
            opacity: 1;
            transform: translateX(0);
          }
        }
        .drill-enter {
          animation: drillIn 180ms ease-out;
        }

        /* Mirror of .drill-enter for the REVERSE transition — stepping back
           out of a drilled column so an earlier column (a parent drilled
           column, or the top-level block card) regains the keyboard focus
           (← , a collapsed-rail click, or the postApprove "Ga door" landing
           back on an already-open ancestor — see drillReturnMarker in
           home.mjs). Slides in from the LEFT (opposite translateX sign) so
           forward vs. backward drilling feel visually distinct. Same
           one-shot, non-repeating rule applies: home.mjs only adds this class
           on the render right after a genuine "return", never on a later
           rebuild of the same column. */
        @keyframes drillReturn {
          from {
            opacity: 0;
            transform: translateX(-6px);
          }
          to {
            opacity: 1;
            transform: translateX(0);
          }
        }
        .drill-return {
          animation: drillReturn 180ms ease-out;
        }
      }

      /* TopLoadingBar's fill (src/TopLoadingBar.mjs) — a sliding "indeterminate"
         segment, distinct from ProgressBar's static, position-encoded fill at
         the bottom of the screen: this one only ever means "wait a moment,
         loading", so an eye-catching repeating motion is exactly right (unlike
         drillIn/drillReturn above, which are deliberately one-shot). Default
         (reduced motion / no-JS-animation fallback): a plain, full-width,
         static bar — the "something is loading" signal still reads without any
         motion. `prefers-reduced-motion: no-preference` then narrows it to a
         sliding segment instead. */
      .top-loading-bar-fill {
        width: 100%;
      }
      @media (prefers-reduced-motion: no-preference) {
        @keyframes topLoadingSlide {
          0% {
            transform: translateX(-100%);
          }
          100% {
            transform: translateX(400%);
          }
        }
        .top-loading-bar-fill {
          width: 25%;
          animation: topLoadingSlide 1.1s ease-in-out infinite;
        }
      }

      /* Call-segment hover (Block.mjs's CALL_HOVER_CLS/onCallSegHover — see
         "Line selection: hover, click, drag-range" in diff-render.md): a
         plain marker class rather than a Tailwind `hover:` variant, because
         Prism's own token tags can split ONE logical call-segment into
         several adjacent DOM spans (one per token) — onCallSegHover toggles
         this SAME class on every one of them together on mouseover/mouseout,
         so the whole segment highlights as a single block instead of only
         whichever one Prism token the cursor happens to sit over. Light/dark
         mirrors like the Prism/markdown blocks below. */
      .call-seg.call-seg-hover {
        background-color: #e2e8f0; /* slate-200 */
      }

      /* Paired-row hover (Block.mjs's onRowPairHover/`data-row-pair`, see
         "Line selection: hover, click, drag-range" in diff-render.md): the
         old/left pane is display-only in a split diff (no click, no active
         cursor of its own — see "Only the new/right pane is selectable"), but
         hovering EITHER side must still light up BOTH — reviewer request. A
         plain marker class, same reasoning as .call-seg-hover: old/new live in
         two entirely separate <code> elements, so a bare CSS :hover can only
         ever affect the element the pointer is actually over, never its
         counterpart in the other pane. Same visual (and same colour tokens) as
         the plain per-row hover bar already used for the non-active-row
         affordance. */
      .row-pair-hover {
        box-shadow: inset 2px 0 0 #94a3b8; /* slate-400 */
      }

      /* Prism token colours only — scoped to every Prism code excerpt via the
         `.language-php`/`.language-typescript` class it carries (the diff panes
         in Block.mjs pick one of the two per block's file extension — see
         Block.mjs's langForFile — the Onderliggende-code cards + comment hint in
         RelatedPanel.mjs and the footer stay on `.language-php`), matched here
         via `:is(.language-php, .language-typescript)` so both share one
         palette regardless of which grammar actually tokenised the block. We
         deliberately drop Prism's own container rules (padding/background/
         margins on pre|code[class*=language-]) so they can't fight the Tailwind
         layout; only the syntax colours come from the vendored theme.

         Higher-contrast light palette (GitHub-light inspired): each category gets
         a clearly distinct, saturated hue so variables, keywords, functions,
         strings and numbers pull apart at a glance instead of blending into the
         muted default (magenta props ~= numbers, olive strings, brown operators). */
      :is(.language-php, .language-typescript) .token.comment,
      :is(.language-php, .language-typescript) .token.prolog,
      :is(.language-php, .language-typescript) .token.doctype,
      :is(.language-php, .language-typescript) .token.cdata {
        color: #57606a; /* gray — recedes, darkened for AA contrast on the
                            light green/rose diff-row tints (Block.mjs) */
        font-style: italic;
      }
      :is(.language-php, .language-typescript) .token.punctuation {
        color: #24292e; /* near-black, not washed-out gray */
      }
      :is(.language-php, .language-typescript) .token.namespace {
        opacity: 0.85;
      }
      /* object properties / accessors & variables — their own steady orange, no
         longer the same magenta as numbers, so `->id`/`$order` read as one kind */
      :is(.language-php, .language-typescript) .token.property,
      :is(.language-php, .language-typescript) .token.variable,
      :is(.language-php, .language-typescript) .token.regex,
      :is(.language-php, .language-typescript) .token.tag,
      :is(.language-php, .language-typescript) .token.symbol,
      :is(.language-php, .language-typescript) .token.deleted {
        color: #bc4c00; /* orange, darkened for contrast */
      }
      :is(.language-php, .language-typescript) .token.boolean,
      :is(.language-php, .language-typescript) .token.number,
      :is(.language-php, .language-typescript) .token.constant {
        color: #0550ae; /* blue, darkened for contrast */
      }
      :is(.language-php, .language-typescript) .token.selector,
      :is(.language-php, .language-typescript) .token.attr-name,
      :is(.language-php, .language-typescript) .token.string,
      :is(.language-php, .language-typescript) .token.char,
      :is(.language-php, .language-typescript) .token.builtin,
      :is(.language-php, .language-typescript) .token.inserted {
        color: #116329; /* green, darkened so strings stay legible on the
                            light green "added"-line background (Block.mjs) */
      }
      :is(.language-php, .language-typescript) .token.operator,
      :is(.language-php, .language-typescript) .token.entity,
      :is(.language-php, .language-typescript) .token.url,
      :is(.language-php, .language-typescript) .token.atrule,
      :is(.language-php, .language-typescript) .token.attr-value,
      :is(.language-php, .language-typescript) .token.keyword {
        color: #cf222e; /* red — keywords & operators, darkened for contrast */
      }
      :is(.language-php, .language-typescript) .token.function,
      :is(.language-php, .language-typescript) .token.class-name {
        color: #6639ba; /* purple — calls & types, darkened for contrast */
      }
      :is(.language-php, .language-typescript) .token.important,
      :is(.language-php, .language-typescript) .token.bold {
        font-weight: 700;
      }
      :is(.language-php, .language-typescript) .token.italic {
        font-style: italic;
      }
      /* Mouse text selection inside a code excerpt (diff panes in Block.mjs,
         Onderliggende-code cards + comment hint in RelatedPanel.mjs, the
         footer) gets its own tint instead of the browser default blue, so it
         reads as distinct from the app's own selection/cursor affordances
         above the green/rose diff-row tints and Prism token colours. */
      :is(.language-php, .language-typescript) ::selection {
        background-color: rgba(79, 70, 229, 0.25); /* indigo-600 tint */
      }

      /* Minimal element styling for rendered Markdown (src/markdown.mjs),
         used for the PR-info column's summary/body/Jira-description
         (prInfoCard in home.mjs). Tailwind's Play CDN has no typography
         plugin without a build step, so this is a small hand-written set of
         rules scoped to `.markdown-body` — just enough for headings, lists,
         links, blockquotes, inline code and the Prism code-fence blocks it
         contains to read well; not a full prose reset. */
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        margin-top: 0.75em;
        margin-bottom: 0.25em;
        font-weight: 600;
        color: #1e293b;
      }
      .markdown-body h1:first-child,
      .markdown-body h2:first-child,
      .markdown-body h3:first-child {
        margin-top: 0;
      }
      .markdown-body p {
        margin: 0.4em 0;
      }
      .markdown-body ul,
      .markdown-body ol {
        margin: 0.4em 0;
        padding-left: 1.4em;
      }
      .markdown-body ul {
        list-style: disc;
      }
      .markdown-body ol {
        list-style: decimal;
      }
      .markdown-body blockquote {
        margin: 0.4em 0;
        padding-left: 0.75em;
        border-left: 3px solid #cbd5e1;
        color: #64748b;
      }
      .markdown-body a {
        color: #4f46e5;
        text-decoration: underline;
      }
      /* Inline code — a subtle indigo tint instead of a near-black pill, in
         line with the rest of the app's indigo accent. `.markdown-body pre
         code` below has higher specificity and resets background/padding
         for a fenced code block's <code> (its colours come from the Prism
         .language-php token rules above, not from here). */
      .markdown-body code {
        background: #eef2ff;
        color: #4338ca;
        border-radius: 0.25rem;
        padding: 0.05em 0.3em;
        font-size: 0.9em;
      }
      .markdown-body pre {
        margin: 0.5em 0;
        padding: 0.5em 0.6em;
        background: #f8fafc;
        border-radius: 0.375rem;
        overflow-x: auto;
      }
      .markdown-body pre code {
        background: none;
        padding: 0;
      }
      .markdown-body img {
        max-width: 100%;
        border-radius: 0.25rem;
      }
      .markdown-body hr {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 0.6em 0;
      }
      /* GFM tables (markdown.mjs's extractTables) — a minimal grid, no
         typography-plugin reset: border-collapse, a light header tint, thin
         cell borders. `.overflow-x-auto` on the wrapper div (markdown.mjs)
         handles a table wider than a narrow chat bubble. */
      .markdown-body table {
        border-collapse: collapse;
        margin: 0.5em 0;
        font-size: 0.9em;
      }
      .markdown-body th,
      .markdown-body td {
        border: 1px solid #e2e8f0;
        padding: 0.3em 0.6em;
      }
      .markdown-body th {
        background: #f1f5f9;
        color: #1e293b;
        font-weight: 600;
      }

      /* Dark-mode overrides for the two colour blocks above. Tailwind's own
         utility classes handle their own dark: variants via the `.dark` class
         (see the tailwind.config script above); these two are plain CSS
         (Prism token colours + markdown-body element styling), so they can't
         key off that class and need their own selectors instead. Two
         equivalent blocks: `@media (prefers-color-scheme: dark)` covers the
         instant before src/theme.mjs has run (and a browser with JS
         disabled, following the OS setting only), `:root[data-theme="dark"]`
         is what actually applies once the reactive theme toggle overrides the
         OS default (systeem/licht/donker, see .claude/rules/conventions.md).
         Every selector inside the @media block carries a
         `:root:not([data-theme='light'])` gate: without it, an OS on dark +
         the manual LIGHT toggle (data-theme="light", no `.dark` class — all
         Tailwind renders light) still applied these dark Prism/markdown
         colours, leaving near-black <pre> blocks and lavender inline-code
         pills floating inside white cards. With the gate the media block
         stays the pre-JS/no-JS fallback (data-theme absent → OS wins) but
         loses to an explicit light choice. Keep the gate when editing.
         Palette: Prism follows a GitHub-dark-inspired set (same
         category-per-hue mapping as the light palette above); markdown-body
         reuses the zinc/indigo dark palette used across the rest of the app. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
        }
        :root:not([data-theme='light']) .call-seg.call-seg-hover {
          background-color: #3f3f46; /* zinc-700 */
        }
        :root:not([data-theme='light']) .row-pair-hover {
          box-shadow: inset 2px 0 0 #71717a; /* zinc-500 */
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.comment,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.prolog,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.doctype,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.cdata {
          color: #8b949e;
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.punctuation {
          color: #c9d1d9;
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.property,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.variable,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.regex,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.tag,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.symbol,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.deleted {
          color: #ffa657;
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.boolean,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.number,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.constant {
          color: #79c0ff;
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.selector,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.attr-name,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.string,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.char,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.builtin,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.inserted {
          color: #7ee787;
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.operator,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.entity,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.url,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.atrule,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.attr-value,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.keyword {
          color: #ff7b72;
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.function,
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) .token.class-name {
          color: #d2a8ff;
        }
        :root:not([data-theme='light']) :is(.language-php, .language-typescript) ::selection {
          background-color: rgba(129, 140, 248, 0.35); /* indigo-400 tint */
        }

        :root:not([data-theme='light']) .markdown-body h1,
        :root:not([data-theme='light']) .markdown-body h2,
        :root:not([data-theme='light']) .markdown-body h3,
        :root:not([data-theme='light']) .markdown-body h4,
        :root:not([data-theme='light']) .markdown-body h5,
        :root:not([data-theme='light']) .markdown-body h6 {
          color: #e4e4e7;
        }
        :root:not([data-theme='light']) .markdown-body blockquote {
          border-left-color: #3f3f46;
          color: #a1a1aa;
        }
        :root:not([data-theme='light']) .markdown-body a {
          color: #818cf8;
        }
        :root:not([data-theme='light']) .markdown-body code {
          background: rgba(99, 102, 241, 0.15);
          color: #c7d2fe;
        }
        :root:not([data-theme='light']) .markdown-body pre {
          background: #18181b;
        }
        :root:not([data-theme='light']) .markdown-body hr {
          border-top-color: #3f3f46;
        }
        :root:not([data-theme='light']) .markdown-body th,
        :root:not([data-theme='light']) .markdown-body td {
          border-color: #3f3f46;
        }
        :root:not([data-theme='light']) .markdown-body th {
          background: #27272a;
          color: #e4e4e7;
        }
      }

      /* Same rules as the @media block above, mirrored for the manual theme
         toggle (src/theme.mjs sets data-theme on <html>) — see the comment
         above the @media block. */
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      :root[data-theme='dark'] .call-seg.call-seg-hover {
        background-color: #3f3f46; /* zinc-700 */
      }
      :root[data-theme='dark'] .row-pair-hover {
        box-shadow: inset 2px 0 0 #71717a; /* zinc-500 */
      }
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.comment,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.prolog,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.doctype,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.cdata {
        color: #8b949e;
      }
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.punctuation {
        color: #c9d1d9;
      }
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.property,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.variable,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.regex,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.tag,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.symbol,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.deleted {
        color: #ffa657;
      }
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.boolean,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.number,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.constant {
        color: #79c0ff;
      }
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.selector,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.attr-name,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.string,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.char,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.builtin,
      :root[data-theme='dark'] :is(.language-php, .language-typescript) .token.inserted {
